name: Android CI Docker

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android CI image
        run: |
          docker build \
            -f .github/docker/android-ci/Dockerfile \
            -t notiflow-android-ci:latest \
            .

      - name: Run unit tests in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v gradle-cache:/home/gradle/.gradle \
            -w /workspace \
            notiflow-android-ci:latest \
            bash -lc "./gradlew :domain:test :data:test :navigation:test :presentation:onboarding:test :presentation:settings:test"

      - name: Build debug APK in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v gradle-cache:/home/gradle/.gradle \
            -w /workspace \
            notiflow-android-ci:latest \
            bash -lc "./gradlew :app:assembleDebug"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-docker
          path: app/build/outputs/apk/debug/*.apk
